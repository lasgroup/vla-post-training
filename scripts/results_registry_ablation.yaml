# Best-of-N critic ablation results registry
# =====================================================================
# Maps each ablation cell -> the results dir + subrun index that holds it.
#
# Unlike results_registry.yaml (one dir per seed), the ablation runs were
# submitted in several small batches under different group names, so a cell is
# addressed by BOTH a directory and the numbered subrun index inside it.
#
# Structure:  <domain>: <num_tasks>: <variant>: <seed>: {dir, index}
#             (null = not run yet)
#
# Task splits:
#   libero 1 : libero_90_82
#   libero 4 : libero_90_79, libero_90_31, libero_90_82, libero_90_38
#   molmo  1 : molmo_138
#   molmo  8 : "1 inst. x cat. 1-8"
#              (molmo_369, molmo_138, molmo_24, molmo_187,
#               molmo_325, molmo_221, molmo_373, molmo_148)
#
# NOTE ON STEP COUNTS (General Rules, FINAL_RUNS.md):
#   single-task = 10 rounds x 10k =  100k steps
#   multi-task  = 10 rounds x 50k =  500k steps
# The libero:4 block below is the pre-existing 100k sweep. It does NOT satisfy
# the multi-task rule and is kept only for reference; the authoritative 500k
# runs come from configs/tuning/bofn/paper_ablation/bofn_libero_tasks4_v0.yaml
# and are recorded under the `libero: 4_500k` block.
#
# NOTE ON EVAL SCHEDULE: every cell here evaluates once, at the final step.
# evaluate_policy() calls agent.sample_actions(), which advances the shared
# self._rng stream, so runs with an extra mid-eval are NOT trajectory-comparable
# with these. Keep the whole ablation on a single final eval.
# =====================================================================

# =====================================================================
# CRITIC WIDTH / BUFFER -- READ BEFORE PLOTTING
# =====================================================================
# The whole BoN multitask sweep for the 1/4/8/16-task splits runs the critic at
#   rl.critic.bronet_hidden_dim = 1024  and  rl.buffer_capacity = 250000
# (the 64-task splits use a larger buffer: 500k-1M). Every ablation cell must
# match 1024/250k, or the comparison measures critic width instead of the
# loss-target / architecture variable it is supposed to isolate.
#
# The older `bofn_tasks1_*` / `bofn_tasks4_*` tuning groups predate the
# bronet_hidden_dim setting and ran at the DEFAULT width 512 with a 500k
# buffer. Cells reused from them are therefore not comparable to cells run
# from the paper_ablation configs.
#
# Status per row (2026-09-03):
#   molmo_1       CLEAN  - baseline repointed to the main sweep; MC cells
#                          re-run at 1024/250k (jobs 3280510-3280515).
#                          DONE 2026-09-04: all 6 MC subruns have the final
#                          eval at 99999, so the whole row is now 1024/250k.
#   libero_4_500k CLEAN  - baseline from the main sweep, rest from
#                          paper_ablation; all 1024/250k. (Two colleague runs,
#                          td_reg_bronet seeds 1/2, have synthetic stub scripts
#                          locally -- their real config is only on wandb and
#                          has NOT been verified.)
#   molmo_8       CLEAN  - all 1024/250k. DONE 2026-09-05: all 12 cells have the
#                          mid-eval at 249999 and the final eval at 499998.
#   libero_1      MIXED  - baseline repointed to 1024/250k, but the other five
#                          cells are still the old 512/500k tuning runs.
#                          DO NOT PLOT this row until they are re-run
#                          (12 cells: td_cls, mc_cls, mc_reg, td_reg_mlp x 3
#                          seeds; +3 more for the bonus td_twohot cell).
#   libero_4      N/A    - the 100k block is reference-only and superseded by
#                          libero_4_500k; left at 512/500k on purpose.
# =====================================================================

