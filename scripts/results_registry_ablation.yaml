    rl.critic.td_weight_schedule.init_value: 0
    rl.critic.num_value_bins: 201
    rl.critic.use_distributional_critic: false    # two-hot cross-entropy
    rl.critic.use_bronet: true
  mc_reg_bronet:
    rl.critic.td_weight_schedule.init_value: 0
    rl.critic.num_value_bins: 1
    rl.critic.use_distributional_critic: false
    rl.critic.use_bronet: true
