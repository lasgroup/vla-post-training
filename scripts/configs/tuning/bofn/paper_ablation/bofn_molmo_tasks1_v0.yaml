script: scripts/exp.py
config_name: pi05_molmo_online_best_of_n
project_name: vla-post-training
group_name: bofn_paper_ablation_tasks1_molmo_v0
params:
  log_interval: [25]
  num_train_steps: [100000]
  max_runtime: [39600]  # 11 hours

  collect.env_num: [8]
  collect.eval_env_num: [8]
  # Final eval only, at step 99999. NOTE: deliberately matches the already-run
  # MC cells of this ablation row (bofn_tasks1_molmo_v0 /
  # bofn_tasks1_distributional_molmo_v0 / bofn_tasks1_seeds1-2_molmo_v0), which
  # have no mid-eval. evaluate_policy() calls agent.sample_actions(), which
  # advances the shared self._rng stream, so adding a mid-eval here would change
  # downstream training randomness and make these runs non-comparable with the
  # reused MC runs.
  collect.eval_interval: [99999]
  !!python/tuple [collect.collect_interval, collect.num_rollouts]: [
    [10000, 20],
  ]
  !!python/tuple [collect.domain, collect.tasks, collect.eval_tasks]: [
    [molmo, [
        molmo_138
      ],
      [
        molmo_138,
        molmo_8, molmo_273, molmo_222, molmo_73, molmo_346, molmo_49, molmo_21, molmo_379,
        molmo_140, molmo_356, molmo_345, molmo_155, molmo_357, molmo_163, molmo_208, molmo_226
      ],
    ],
  ]

  collect.store_prefix_rep: [True]

  rl.critic.batch_size: [1024]
  rl.critic.inference_start_step: [1]   # To speed up data collection at step 0
  rl.critic.pre_training_steps: [0]
  rl.critic.td_weight_schedule.switch_step: [999999]  # No switch

  # Trimmed to the two ablation cells that have NOT been run for Molmo 1-task.
  # Already available (see scripts/results_registry_ablation.yaml):
  #   TD + regression     + Bronet  (baseline)     -> bofn_tasks1_molmo_v0 / bofn_tasks1_seeds1-2_molmo_v0
  #   MC + classification + Bronet                 -> bofn_tasks1_distributional_molmo_v0 / ..._seeds1-2_molmo_v0
  #   MC + regression     + Bronet                 -> bofn_tasks1_molmo_v0 / bofn_tasks1_seeds1-2_molmo_v0
  !!python/tuple [rl.critic.td_weight_schedule.init_value, rl.critic.td_weight_schedule.end_value, rl.critic.use_distributional_critic, rl.critic.num_value_bins, rl.critic.use_bronet]: [
    [1, 1, True,  201, True],    # TD + classification (C51) + Bronet
    [1, 1, False, 1,   False],   # TD + regression           + MLP
  ]

  rl.critic.bronet_hidden_dim: [1024]

  rl.buffer_capacity: [250000]
  rl.online_ratio: [1.0]

  seed: [0, 1, 2]
