script: scripts/exp.py
config_name: pi05_molmo_online_best_of_n
project_name: vla-post-training
group_name: bofn_paper_ablation_tasks1_mc_molmo_v0
params:
  log_interval: [25]
  num_train_steps: [100000]
  max_runtime: [39600]  # 11 hours

  collect.env_num: [8]
  collect.eval_env_num: [8]
  # Final eval only, at 99999 -- matches the td_cls / td_reg_mlp cells of this
  # row (group bofn_paper_ablation_tasks1_molmo_v0).
  collect.eval_interval: [99999]
  !!python/tuple [collect.collect_interval, collect.num_rollouts]: [
    [10000, 20],
  ]
  !!python/tuple [collect.domain, collect.tasks, collect.eval_tasks]: [
    [molmo, [
        molmo_138
      ],
      [
        molmo_138,
        molmo_8, molmo_273, molmo_222, molmo_73, molmo_346, molmo_49, molmo_21, molmo_379,
        molmo_140, molmo_356, molmo_345, molmo_155, molmo_357, molmo_163, molmo_208, molmo_226
      ],
    ],
  ]

  collect.store_prefix_rep: [True]

  rl.critic.batch_size: [1024]
  rl.critic.inference_start_step: [1]
  rl.critic.pre_training_steps: [0]
  rl.critic.td_weight_schedule.switch_step: [999999]

  # Re-run of the two MC cells of the Molmo 1-task ablation row.
  #
  # WHY: the original MC cells were reused from the older bofn_tasks1_*_molmo_v0
  # tuning sweep, which predates `bronet_hidden_dim: 1024` and ran with the
  # default width 512 and a 500k buffer. The rest of the row (and the whole BoN
  # multitask sweep for the 1/4/8/16-task splits) uses 1024 / 250k, so the row
  # was comparing critic width, not the loss target. These re-runs restore the
  # comparison. See scripts/results_registry_ablation.yaml.
  !!python/tuple [rl.critic.td_weight_schedule.init_value, rl.critic.td_weight_schedule.end_value, rl.critic.use_distributional_critic, rl.critic.num_value_bins, rl.critic.use_bronet]: [
    [0, 0, False, 201, True],   # MC + classification (two-hot) + Bronet
    [0, 0, False, 1,   True],   # MC + regression               + Bronet
  ]

  rl.critic.bronet_hidden_dim: [1024]

  rl.buffer_capacity: [250000]
  rl.online_ratio: [1.0]

  seed: [0, 1, 2]
