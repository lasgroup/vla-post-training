script: scripts/exp.py
config_name: pi05_molmo_online_best_of_n
project_name: vla-post-training
group_name: multitask_tasks1_bofn_molmo_v0_seed2_rest
params:
  log_interval: [25]
  num_train_steps: [100000]
  max_runtime: [39600]  # 11 hours

  collect.env_num: [8]
  collect.eval_env_num: [8]
  collect.eval_interval: [99999]
  !!python/tuple [collect.collect_interval, collect.num_rollouts]: [
    [10000, 20],
  ]
  # The three molmo_1 tasks that were NOT covered by the original tasks1 sweep.
  # `molmo_1` is [molmo_267, molmo_366, molmo_138, molmo_143]; the original
  # multitask_tasks1_*_molmo_v0_seed* groups only ran molmo_138, while FSFT ran
  # all four. These runs close that gap so the 1-task cell of the multitask-gain
  # figure averages over the same four tasks for every method.
  #
  # Separate group_name (suffix `_rest`) on purpose: the launcher derives the
  # results dir from group_name and indexes runs positionally, so reusing the
  # original group would write these into the finished molmo_138 run's dirs.
  # Index mapping here: 0 = molmo_267, 1 = molmo_366, 2 = molmo_143.
  # See scripts/results_registry.yaml.
  !!python/tuple [collect.domain, collect.tasks, collect.eval_tasks]: [
    [molmo, [
        molmo_267
      ],
      [
        molmo_267,
        molmo_8, molmo_273, molmo_222, molmo_73, molmo_346, molmo_49, molmo_21, molmo_379,
        molmo_140, molmo_356, molmo_345, molmo_155, molmo_357, molmo_163, molmo_208, molmo_226
      ],
    ],
    [molmo, [
        molmo_366
      ],
      [
        molmo_366,
        molmo_8, molmo_273, molmo_222, molmo_73, molmo_346, molmo_49, molmo_21, molmo_379,
        molmo_140, molmo_356, molmo_345, molmo_155, molmo_357, molmo_163, molmo_208, molmo_226
      ],
    ],
    [molmo, [
        molmo_143
      ],
      [
        molmo_143,
        molmo_8, molmo_273, molmo_222, molmo_73, molmo_346, molmo_49, molmo_21, molmo_379,
        molmo_140, molmo_356, molmo_345, molmo_155, molmo_357, molmo_163, molmo_208, molmo_226
      ],
    ],
  ]

  collect.store_prefix_rep: [True]

  rl.critic.batch_size: [1024]
  rl.critic.inference_start_step: [1]   # To speed up data collection at step 0
  rl.critic.pre_training_steps: [0]
  rl.critic.td_weight_schedule.switch_step: [999999]  # No switch

  !!python/tuple [rl.critic.td_weight_schedule.init_value, rl.critic.td_weight_schedule.end_value, rl.critic.use_distributional_critic, rl.critic.num_value_bins]: [
    [1, 1, False, 1],     # TD (regression)
  ]

  rl.critic.use_bronet: [True]
  rl.critic.bronet_hidden_dim: [1024]

  rl.buffer_capacity: [250000]
  rl.online_ratio: [1.0]

  seed: [2]
