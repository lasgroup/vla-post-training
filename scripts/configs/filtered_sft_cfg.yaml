script: scripts/exp.py
config_name: pi05_libero_online_filtered_sft
project_name: filtered_sft_cfg
group_name: filtered_sft_cfg
params:
  log_interval: [25]
  lr_schedule.value: [2.5e-5]
  num_train_steps: [5_000]
  batch_size: [256]

  collect.collect_interval: [500]
  collect.num_rollouts: [20]
  collect.env_num: [8]
  collect.eval_env_num: [8]
  collect.eval_interval: [4999]
  !!python/tuple [collect.tasks, collect.eval_tasks]: [
    [[libero_90_79, libero_90_31, libero_90_82, libero_90_38], [libero_90_79, libero_90_31, libero_90_82, libero_90_38]],
  ]

  rl.discount: [0.995]
  rl.buffer_capacity: [500000]
  rl.online_ratio: [1.0]
  # Prompt dropout during training; eval is swept over each guidance scale
  # (1.0 is the unguided baseline on the same weights).
  rl.cfg_dropout_prob: [0.1]
  rl.cfg_scale: [[1.0, 1.5, 2.0, 3.0]]

  seed: [0]
