script: scripts/exp.py
config_name: pi05_libero_online_ogpo_sft
project_name: ogpo_sweep
group_name: ogpo_sweep
params:
  log_interval: [25]
  lr_schedule.value: [2.5e-5]
  num_train_steps: [10_000]
  batch_size: [256]
  overwrite: [True]
  # Polyak target for PG: ema_decay=0.995 ≈ original OGPO's actor_tau=0.005.
  # Keeps the "old" policy close to current so the PPO ratio stays near 1.
  ema_decay: [0.995]

  collect.collect_interval: [300]
  collect.eval_interval: [300]
  collect.num_rollouts: [1]
  collect.num_initial_rollouts: [5]
  collect.num_eval_rollouts: [8]
  collect.env_num: [1]
  collect.eval_env_num: [1]
  collect.use_time_to_success_as_reward: [True]
  !!python/tuple [collect.tasks, collect.eval_tasks]: [
    [libero_90_59, libero_90_59],
  ]

  rl.buffer_capacity: [250000]
  rl.online_ratio: [1.0]
  rl.store_success_episodes_only: [True]
  rl.policy.training_start_step: [900]
  rl.policy.update_interval: [1]
  rl.critic.pre_training_steps: [900]
  rl.critic.num_updates_per_batch: [10]
  # Train critic on MC returns only (switch_step beyond num_train_steps keeps
  # td_weight at 0); pair with rl.critic.use_ema=False for parity with AWR.
  rl.critic.td_weight_schedule.switch_step: [1_000_000]
  rl.critic.use_ema: [False]

  # OGPO-specific. v1 uses G=1 with a V-function baseline (advantage = Q - V),
  # not OGPO's group-relative baseline — much cheaper per update. Switch
  # adv_strategy to "vanilla" and bump group_num_samples for OGPO-square parity.
  rl.group_num_samples: [1]
  rl.clip_epsilon: [0.01]
  rl.bc_coeff: [1.0]
  rl.num_sde_steps: [10]
  rl.noise_level: [0.3]
  rl.adv_strategy: ["subtract_v"]

  seed: [1]
