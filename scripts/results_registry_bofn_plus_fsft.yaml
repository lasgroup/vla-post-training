# bofn_plus_fsft multitask results registry
# =====================================================================
# Same structure as results_registry.yaml but for the bofn_plus_fsft twin
# runs: pi05_{env}_online_aw_sft with n_samples=32, awr_loss_weight=0,
# filtered_sft_weight=1 (BoN action selection + filtered-SFT policy update).
#
# Structure:  <domain>: <num_tasks>: <seed>: <dir | null>
#
# Task-count layout mirrors bofn's:
#   libero num_tasks=1 : indices 0-3 are the four single-task runs.
#   molmo  num_tasks=8 : index 0 = "8 inst x cat 1", index 1 = "1 inst x cat 1-8".
#   molmo  num_tasks=1 : four single-task runs (molmo_267/366/138/143) spread
#                        over two dirs -- see the molmo: 1: entry below.
# =====================================================================

results_root: /capstor/store/cscs/swissai/a0220/ralfroemer/results

libero:
  1:
    0: vla-post-training_multitask_tasks1_bofn_plus_fsft_libero_v0_seed0
    1: vla-post-training_multitask_tasks1_bofn_plus_fsft_libero_v0_seed1
    2: vla-post-training_multitask_tasks1_bofn_plus_fsft_libero_v0_seed2
  4:
    0: vla-post-training_multitask_tasks4-16_bofn_plus_fsft_libero_v0_seed0
    1: vla-post-training_multitask_tasks4-16_bofn_plus_fsft_libero_v0_seed1
    2: vla-post-training_multitask_tasks4-16_bofn_plus_fsft_libero_v0_seed2
