    2: vla-post-training_multitask_tasks4-16_bofn_plus_fsft_libero_v0_seed2
  64:
    0: null
    1: null
    2: null

molmo:
  1:
    # The four molmo_1 single-task runs, split across two group dirs: the
    # original sweep ran only molmo_138 (index 0 of the first dir), the `_rest`
    # sweep adds molmo_267 / molmo_366 / molmo_143 (indices 0/1/2 of the second).
    # Consumers must aggregate every index of every listed dir, as for libero 1.
    0: [vla-post-training_multitask_tasks1_bofn_plus_fsft_molmo_v0_seed0,
        vla-post-training_multitask_tasks1_bofn_plus_fsft_molmo_v0_seed0_rest]
    1: [vla-post-training_multitask_tasks1_bofn_plus_fsft_molmo_v0_seed1,
        vla-post-training_multitask_tasks1_bofn_plus_fsft_molmo_v0_seed1_rest]
    2: [vla-post-training_multitask_tasks1_bofn_plus_fsft_molmo_v0_seed2,
        vla-post-training_multitask_tasks1_bofn_plus_fsft_molmo_v0_seed2_rest]
  4:
    # 2/3 seeds complete as of 2026-09-10: seeds 0/1 have the final eval at 499998,
    # seed 2 is at 499998 awaiting its final eval (job 3289553) -- do not read seed 2 yet.
    0: vla-post-training_multitask_tasks4_bofn_plus_fsft_molmo_v0_seed0
    1: vla-post-training_multitask_tasks4_bofn_plus_fsft_molmo_v0_seed1
    2: vla-post-training_multitask_tasks4_bofn_plus_fsft_molmo_v0_seed2
