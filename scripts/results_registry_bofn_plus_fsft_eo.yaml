# bofn_plus_fsft_eo (expert-only fine-tuning) multitask results registry
# =====================================================================
# Same structure as results_registry_bofn_plus_fsft.yaml but for the
# expert-only twin runs: pi05_{env}_online_aw_sft_expert_only with
# n_samples=32, awr_loss_weight=0, filtered_sft_weight=1, and PaliGemma
# LLM stack 0 + SigLIP img tower frozen (only the action expert / stack 1
# + action-projection MLPs receive gradients). Otherwise the schedule
# mirrors the tasks8 Molmo EO run (5 rounds = 250k steps, single final
# eval at 249999, buffer_capacity=250000).
#
# Structure:  <domain>: <num_tasks>: <seed>: <dir | null>
#
# Task-count layout mirrors bofn_plus_fsft:
#   libero num_tasks=1 : indices 0-3 are the four single-task runs.
#   libero num_tasks=4/16: share a tasks4-16 dir per seed (idx 0 = 4, idx 1 = 16).
#   molmo  num_tasks=8 : index 0 = "8 inst x cat 1", index 1 = "1 inst x cat 1-8".
#   molmo  num_tasks=1 : four single-task runs (molmo_267/366/138/143) spread
#                        over two dirs -- see the molmo: 1: entry below.
# =====================================================================

