# =============================================================================
# OGPO Configuration
# =============================================================================
# Matches scripts/ogpo/ogpo_square.sh from old sbp_spl codebase exactly.

_base_: common.yaml

experiment:
  project: OGPO_square_ablations
  run_group: square
  run_name: square_flow
  wandb_name: square_flow
  seed: 82723
  log: true
  save_dir: /data/user_data/$USER/ogpo

env:
  name: square-mh-low_dim
  rew_fn: sparse
  sparse: false
  post_success_steps: 0
  parallel_envs: 1   # pi05 only (main_pi05.py, collection_mode=rounds): envs per task run at once for collection/eval
  vector_envs: false # pi05 rounds only: run the envs in worker processes (AsyncVectorEnv), all tasks' waves at once
  inference_batch: 16  # pi05 vector_envs only: rows per encode/policy call, sharded over the devices with gpu_mode=multi
                       # (each device computes rows / n_dev; BoN KV ~17.8 MB x rows / n_dev x best_of_n per device)
  worker_egl_devices: ""  # pi05 vector_envs only: GPUs the worker processes render on, round robin: "" = all on the
                          # trainer's EGL GPU (MUJOCO_EGL_DEVICE_ID), auto = CUDA_VISIBLE_DEVICES, or "0,1,..."

training:
  bc_pi_steps: 500000
  bc_q_steps: 0
  calql_steps: 0
  q_warmup_steps: 0
  bc_refine_steps: 0
  online_steps: 2000000
  bc_only: false
  force_jax_sync: true
  # pi05 runner only (ogpo/main_pi05.py); main.py does not read these.
  actor_update_interval: 1    # full actor+critic update every N updates; critic-only otherwise
  freeze_actor: false         # critic-only updates forever (BoN-only baseline); actor_update_interval ignored
  first_round_policy: bon     # rounds only: bon | ode (round 0 collects with one unclipped ODE sample, as vla-post-training)
  zero_actor_state: false     # multi-GPU only (ZeRO-1): shard the actor optimiser state + init copy across devices
  restore_checkpoint: ""      # path to a checkpoint_latest.pkl (save_checkpoint): load actor / target actor / critic before running
  eval_modes: "ode,bon"       # eval_only: which evals to run (ode | bon | ode,bon)
  eval_base_actor: false      # with restore_checkpoint: keep the base pi05 actor / target actor, restore only the critic (BoN with the base policy as proposal, trained critic as ranker)
  eval_only: false            # restore_checkpoint + one ODE and one BoN eval on env.eval_name (default: env.name), then exit; no training
  # rounds only: mirror the replay buffer + agent to resume_s3 (an s3:// URI or a directory) so a restarted job continues.
  # Env fallbacks OGPO_RESUME_DIR / OGPO_RESUME_S3 (for a launcher that cannot pass flags).
  resume_dir: null            # local scratch for the files being uploaded / fetched
  resume_s3: null
  resume_ckpt_interval: 250   # updates between agent checkpoints (a restart loses at most this many + the open collection)
  resume_rebase_rounds: false # continue a resume that ends a finished round with a new updates_per_round (offset kept in the manifest)
  # rounds only: continue from a snapshot of a live run: <dir>/agent.pkl, buffer/, csv/ (layout of ogpo/utils/resume.py save_buffer_dump). With buffer.storage_dir
  # the snapshot's images / next_images memmaps must already be there and buffer.reuse_storage must be true.
  resume_snapshot_dir: ""
  awr_value_steps: 200        # rounds + agent.pi05_actor_objective=awr: V steps on R^λ per target refresh, before the round's policy steps (Peng et al. 2019: 200)
  awr_value_refreshes: 1      # AWR: K x (recompute R^λ with the current V -> awr_value_steps V steps) per round; the reference refreshes once per 2048 new samples

buffer:
  size: 2000000
  storage_dir: null           # pi05 runner: existing dir (node-local disk) for the buffer's images / next_images memmaps; null = RAM
  reuse_storage: false        # open the existing images / next_images memmaps in storage_dir with their contents (training.resume_snapshot_dir only)
  start_training: 10000
  utd_warmup: 1
  utd_online: 1
  offline_ratio: 0.0

eval:
  n_eval_envs: 32
  eval_episodes: 2
  plot_q_vs_mc: false

intervals:
  log_interval: 5000
  eval_interval_bc: 5000
  eval_interval: 20000
  save_interval_bc: -1
  save_interval: 500000
  preemption_backup_interval: -1
  step_data_log_interval: -1

bc:
  clip_bc: true
  clip_bc_threshold: 0.45
  clip_bc_wrt: "ODE"   # "ODE" | "SDE" — OGPO low_dim scripts override to "SDE"

success_buffer:
  use_success_buffer: true
  batch_size: 256

dataset:
  proportion: 1.0

checkpoint:
  restore_actor_path: null
  restore_critic_path: null
  ep_resume: 0

agent:
  agent_name: ogpo

  # Learning rates
  lr: 3e-4
  actor_lr: 3e-4
  critic_lr: 3e-4
  ppo_lr: 4.5e-5
  clip_grad_norm: 1000.0

  # Target network EMA
  tau: 0.05
  actor_tau: 0.05

  # PPO parameters
  ppo_batch_size: 256
  clip_epsilon: 0.01
  entropy_coeff: 0.0
  use_constant_scheduler_for_bc: true

  # GRPO parameters
  group_num_samples: 32

  # BC regularization
  use_bc_regularization: true
  bc_coeff: 0.1

  # Noise network (constant noise for SDE sampling)
  use_constant_noise: true
  constant_noise_std: 0.005
  min_noise_std: 0.005
  max_noise_std: 0.005

  # Q-target variance reduction
  q_variance_reduction: false
  q_vr_num_samples: 8
  q_vr_reduction: mean      # mean | median | trimmed_mean
  pi05_robot: libero        # pi05 only: libero (pi05_libero, 7-D absolute EEF actions) | droid (pi05_droid_jointpos: 8-D, joints as deltas to the window-start state); must match the env family (main_pi05 checks)
  pi05_critic_pooling: all  # pi05 only: all | segmented | per_camera (prefix pooling for critic features)
  pi05_critic_arch: mlp     # pi05 only: mlp (value_hidden_dims heads) | bronet (BroNet heads behind two-tier) | bronet_vla (vla-post-training BroNet Q exactly; needs pooling all)
  pi05_bronet_hidden_dim: 1024  # pi05 only, pi05_critic_arch=bronet | bronet_vla: BroNet width
  pi05_bronet_depth: 2      # pi05 only, pi05_critic_arch=bronet | bronet_vla: BroNet residual blocks
  pi05_bon_sampler: sde     # pi05 only: BoN candidates sde (target-actor SDE, as OGPO) | ode (unclipped Euler ODE, as vla-post-training BoN)
  pi05_drop_empty_camera: false  # pi05 only: KV-only prefix passes (updates, sampling) skip the always-masked right-wrist slot (~1/3 fewer prefix tokens; same KV / velocities; pooled critic features keep the full prefix)
  pi05_actor_objective: ppo # pi05 only: ppo (OGPO) | awr (paper AWR: advantage-weighted flow matching on buffer windows, A = R^λ - V; needs use_value_fn + v_training_mode=lambda_return, rounds) | group_awr (OGPO's SDE samples + group advantages, AWR loss min(exp(A/β), ω_max) * CFM in place of PPO)
  pi05_bon_agg: subsample   # pi05 only: BoN head reduction min | subsample (min of 2 random heads per candidate) | mean; replaces subsample_bon for pi05
  grad_accum_steps: 1       # pi05 only: split each actor / critic update into K sequential micro-batches

  # Value function V(s) — ablation for eliminating multi-action Q-target rollouts
  use_value_fn: false          # pi05: SARSA-V critic (state-value ensemble; needs v_training_mode=sarsa)
  v_ensemble_size: 10
  v_agg: mean                   # mean | min | subsample; pi05 SARSA-V: reduction for both the V target (Q heads) and the Q bootstrap (V heads)
  v_training_mode: td_offpolicy # td_offpolicy | bc_q_mean | sarsa (pi05 only: V(s) <- Q_tgt(s, a_buffer), vla-post-training BoN) | lambda_return (pi05 AWR only: V(s) <- R^λ)
  v_loss_coeff: 1.0
  v_pair_with_q: false          # If true, supervise V_i per-head (requires v_ensemble_size==num_qs)
  adv_baseline: group_mean      # group_mean | v_fn

  # MC regression (Q-value calibration)
  mc_regression: false
  mc_regression_coeff: 1.0

  # Success buffer for critic
  use_success_buffer_q: false

  # Flow timestep encoding
  time_embedding: sinusoidal  # scalar | sinusoidal
  time_embedding_dim: 32

  # Policy settings
  flow_steps: 10
  ft_flow_steps: 10          # 0 = use flow_steps; >0 = override during RL finetuning
  best_of_n: 8
  normalize_group: false
  clip_min_epsilon_multiplier: 1.0
  clip_max_epsilon_multiplier: 1.0
  adv_clip_min: null
  adv_strategy: vanilla  # vanilla | conservative | awr
  awr_beta: 0.05

  # Logprob normalization (matches old code defaults)
  normalize_denoising_horizon: true
  normalize_act_space_dimension: true

  # SDE-ODE correction
  error_correct_sde_to_ode: true
  use_denoiser: true

  # AWR (Advantage-Weighted Regression) settings
  use_awr: false              # Toggle AWR weighted-CFM loss vs OGPO log-prob ratio
  awr_n_mc: 16                # Number of (tau, eps) MC samples for AWR CFM loss (also pi05 group_awr: actor memory ~ PPO's at awr_n_mc = flow_steps)
  awr_weight_max: 20.0        # Clamp AWR weights (exp(A/β)) for stability
  awr_mode: symmetric         # symmetric | asymmetric | positive_only (pi05 awr / group_awr: symmetric only)
  awr_lambda: 0.95            # pi05 AWR only: λ of the TD(λ) return R^λ (Peng et al. 2019: 0.95)
  awr_normalize_adv: false    # pi05 AWR only: A <- (A - mean) / (std + 1e-5) over the buffer before exp(A / β) (reference awr_agent._calc_adv; its temp is 1.0)

  # FPO (Flow Policy Optimization) settings
  use_fpo: false              # Toggle FPO ratio vs OGPO log-prob ratio
  fpo_n_mc: 16                # Number of (tau, eps) MC samples for CFM loss
  fpo_per_sample: true        # FPO++ per-sample ratio clipping
  fpo_use_aspo: false         # FPO++ ASPO trust region (SPO for negative adv)
  fpo_zero_sampling: false    # FPO++ zero-sampling at eval (ODE from 0)
  fpo_cfm_loss_clamp: 4.0     # Clamp individual CFM losses (ref FPO uses 4.0)
  fpo_cfm_diff_clamp: 5.0     # Clamp CFM loss difference before exp
  fpo_use_huber: false         # Use Huber loss instead of MSE for CFM (ref uses True)
  fpo_huber_delta: 1.0         # Huber delta (ref sweeps 0.5-2.0)

  # ---- Slow reference policy (pi_slow) ----
  # Shared by chi_po (chi^2 pessimism), kl_reg (reverse KL), fwd_kl_reg (forward
  # KL via BC). Initialized at start of online phase as a snapshot of the BC
  # actor; updated each actor step via Polyak EMA at rate `tau_slow`.
  tau_slow: 0.0005                  # EMA rate for pi_slow (vs actor_tau=0.05 for target)
  chi_po_ref_tau: 0.0005            # legacy alias of tau_slow; kept for back-compat with older scripts

  # chi2-Pessimistic OGPO (chiPO)
  chi_po: false
  chi_po_beta_base: 0.1
  chi_po_q_std_target: 1.0
  chi_po_ensemble_alpha: 5.0
  chi_po_R_max: 10.0                # calibrate per env: ~1/(1-gamma) for sparse reward

  # KL-Pessimistic OGPO (reverse KL; stacks with chi_po)
  kl_reg: false
  kl_reg_beta_base: 0.1
  kl_reg_ensemble_alpha: 5.0
  kl_reg_R_max: 10.0

  # Forward-KL regularization: BC flow-matching against samples from pi_slow
  # (KL(pi_slow || pi)). Pulls pi toward covering all modes of pi_slow.
  fwd_kl_reg: false
  fwd_kl_bc_coeff: 0.1

  # FQL (Flow Q-Learning) settings - One-Step Policy
  use_one_step_policy: false           # Enable one-step policy for FQL
  train_one_step_in_offline: false     # Train one-step policy during offline/BC phase
  train_one_step_in_online: false      # Train one-step policy during online RL phase
  fql_distillation_coeff: 10.0         # Alpha: weight for distillation vs Q-maximization
  fql_train_main_policy: true          # When false, disables main policy PG/advantage training
  use_one_step_for_targets: false      # Use one-step policy for computing TD targets
  use_one_step_for_rollouts: false     # Use one-step policy for online rollouts

  # Architecture backbone (independent for actor/critic)
  actor_backbone: mlp       # mlp | tf
  critic_backbone: mlp      # mlp | tf
  actor_hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]

  # Vision configuration (active when env has image observations)
  actor_obs: state           # state | image
  critic_obs: state          # state | image
  vit_encoder: minvit        # minvit | minvit_small | minvit_large
