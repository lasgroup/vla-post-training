[project]
name = "vla-post-training"
version = "0.0.1"
description = "Multi-task post-training for VLAs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "augmax==0.4.1",
    "dm-tree==0.1.8",
    "einops==0.8.1",
    "equinox==0.12.2",
    "flatbuffers>=25.2.10",
    "flax==0.10.6",
    "fsspec[gcs]==2025.3.0",
    "gym-aloha==0.1.2",
    "imageio==2.37.0",
    "jax[cuda12]==0.6.0",
    "jaxtyping==0.2.36",
    "lerobot==0.3.3",
    "ml_collections==1.0.0",
    "numpy==1.26.4",
    "numpydantic==1.6.9",
    "opencv-python==4.11.0.86",
    "orbax-checkpoint==0.11.13",
    "pillow==11.2.1",
    "sentencepiece==0.2.0",
    "torch==2.7.1",
    "tqdm-loggable==0.2",
    "typing-extensions==4.13.2",
    "tyro==0.9.22",
    "wandb==0.24.0",
    "filelock==3.18.0",
    "beartype==0.19.0",
    "treescope==0.1.9",
    "transformers==4.53.2",
    "rich==14.0.0",
    "polars==1.30.0",
    "hf-libero==0.1.3",
    "sentry_sdk==2.0.0",
    "av==16.1.0",
    "tensorflow-probability>=0.25.0",

    "compress-json==1.1.1",
    "jaxlie==1.5.0",
    "lmdb",
    "mujoco-mjx==3.4.0",
    "mujoco==3.4.0",
    "nltk==3.9.2",
    "scikit-image",
    "stringcase==1.2.0",
    "teledex",
    "zstandard",
]

[project.urls]
Repository = "https://github.com/lasgroup/vla-post-training"

[tool.uv]
# jaxlib 0.6.0 is built against CUDA 12.9 and needs a matching 12.9 runtime for the
# sm_120 (Blackwell) collective-matmul fix -- on 12.6/12.8 runtimes the fused
# collective-matmul crashes (Xid 13 / "unsupported value"). torch 2.7.1 only ships
# up to cu128 (CUDA 12.8) and lerobot caps torch<2.8, so we pin the *shared* CUDA
# libs up to jax's known-good 12.9 set and let torch 2.7.1 run on them via CUDA 12.x
# forward compatibility. cudnn likewise bumped to jax's 9.24 (torch runs fwd-compat).
override-dependencies = [
    "nvidia-cuda-runtime-cu12==12.9.79",
    "nvidia-cuda-nvcc-cu12==12.9.86",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
    "nvidia-cuda-cupti-cu12==12.9.79",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cufft-cu12==11.4.1.4",
    "nvidia-cusolver-cu12==11.7.5.82",
    "nvidia-cusparse-cu12==12.5.10.65",
    "nvidia-nvjitlink-cu12==12.9.86",
    "nvidia-cudnn-cu12==9.24.0.43",
    "nvidia-nccl-cu12==2.30.7",
]

# torch 2.7.1 from PyTorch's cu128 index (closest to 12.9; libs overridden up above).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.0",
    "pynvml>=12.0.0",
]
